<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HOANGGIA CAD AI · Field Editor</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b111b;color:#edf2f7;font:14px system-ui}header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #344053}b.gold{color:#d8ba7d}main{padding:10px;max-width:1600px;margin:auto}.tools{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}button,.pick,select{background:#1d2c40;color:#f3f5f8;border:1px solid #3c516a;border-radius:9px;padding:10px 12px;font:inherit;cursor:pointer}.pick,.primary{background:#c9a76b;color:#111a24;font-weight:700}.active{outline:2px solid #e9c788}.view{position:relative;height:calc(100dvh - 220px);min-height:310px;border:1px solid #344b61;border-radius:12px;overflow:hidden;background:#101b2b}canvas{width:100%;height:100%;touch-action:none;display:block}.hint{position:absolute;left:10px;top:10px;background:#0b111bcf;padding:8px;border-radius:7px;color:#bbc8d5;pointer-events:none;max-width:85%}footer{padding:12px 2px;color:#b9c5d4;font-size:12px}input[type=file]{display:none}@media(max-width:600px){header small{display:none}.view{height:calc(100dvh - 244px)}button,.pick,select{padding:10px 9px;font-size:12px}}
</style></head><body><header><strong>HOANGGIA <b class="gold">CAD AI</b></strong><small>FIELD EDITOR · DXF BETA</small></header><main><div class="tools"><label class="pick">Mở DXF/DWG<input id="file" type="file" accept=".dxf,.dwg"></label><button id="fit">Vừa khung</button><button id="pan" class="active">Di chuyển</button><button id="measure">Đo 2 điểm</button><select id="furniture"><option value="">+ Nội thất</option><option value="sofa">Sofa 2200×900</option><option value="bed">Giường 1800×2000</option><option value="table">Bàn 1600×800</option><option value="chair">Ghế 500×500</option></select><button id="undo">Hoàn tác</button><button id="save" class="primary">Lưu DXF</button></div><div class="view"><canvas id="c"></canvas><div class="hint" id="hint">Mở DXF để xem và đo. Chưa hỗ trợ giải mã DWG trực tiếp.</div></div><footer id="status">Chưa mở tệp · Đơn vị đo theo tọa độ bản vẽ · Bản thử nghiệm</footer></main><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),status=document.getElementById('status'),hint=document.getElementById('hint');let shapes=[],added=[],raw='',fileName='',scale=1,ox=0,oy=0,mode='pan',down=null,measureStart=null,unit='đơn vị',touches=new Map(),pinch=null;const sizes={sofa:[2200,900],bed:[1800,2000],table:[1600,800],chair:[500,500]};function say(s){status.textContent=s}function parse(text){const lines=text.replace(/\r/g,'').split('\n');let pairs=[];for(let i=0;i+1<lines.length;i+=2)pairs.push([lines[i].trim(),lines[i+1].trim()]);let section='',entity=null,out=[],insunits=0;function finish(){if(!entity)return;let e=entity;entity=null;if(e.type==='LINE'){out.push({type:'LINE',p:[[+e.a[0]||0,+e.a[1]||0],[+e.b[0]||0,+e.b[1]||0]],layer:e.layer});}else if(e.type==='CIRCLE'||e.type==='ARC'){out.push({type:e.type,x:+e.x||0,y:+e.y||0,r:Math.abs(+e.r||0),start:+e.start||0,end:+e.end||360,layer:e.layer});}else if(e.type==='LWPOLYLINE'&&e.points.length){out.push({type:'POLY',p:e.points,closed:!!(e.flags&1),layer:e.layer});}else if(e.type==='POINT'){out.push({type:'POINT',x:+e.x||0,y:+e.y||0,layer:e.layer});}}for(let i=0;i<pairs.length;i++){let [k,v]=pairs[i];if(k==='0'){finish();if(v==='SECTION'){section=pairs[i+1]?.[1]==='ENTITIES'?'ENTITIES':pairs[i+1]?.[1]==='HEADER'?'HEADER':'';}else if(v==='ENDSEC')section='';else if(section==='ENTITIES'&&['LINE','CIRCLE','ARC','LWPOLYLINE','POINT'].includes(v))entity={type:v,a:[],b:[],points:[],layer:'0',flags:0};continue;}if(section==='HEADER'&&v==='$INSUNITS'&&k==='9')insunits=+(pairs[i+1]?.[1]||0);if(!entity)continue;if(k==='8')entity.layer=v;else if(k==='10'){if(entity.type==='LWPOLYLINE')entity.points.push([+v,0]);else entity.x=v,entity.a[0]=v;}else if(k==='20'){if(entity.type==='LWPOLYLINE'&&entity.points.length)entity.points.at(-1)[1]=+v;else entity.y=v,entity.a[1]=v;}else if(k==='11')entity.b[0]=v;else if(k==='21')entity.b[1]=v;else if(k==='40')entity.r=v;else if(k==='50')entity.start=v;else if(k==='51')entity.end=v;else if(k==='70')entity.flags=+v;}finish();return {out,insunits};}
function coords(){const p=[];for(const s of [...shapes,...added]){if(s.p)p.push(...s.p);if(s.type==='CIRCLE'||s.type==='ARC')p.push([s.x-s.r,s.y-s.r],[s.x+s.r,s.y+s.r]);if(s.type==='POINT')p.push([s.x,s.y]);}return p;}
function fit(){const p=coords(),w=c.clientWidth,h=c.clientHeight;if(!p.length){scale=1;ox=w/2;oy=h/2;draw();return;}let xs=p.map(x=>x[0]),ys=p.map(x=>x[1]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);scale=Math.min((w-60)/Math.max(1,maxX-minX),(h-60)/Math.max(1,maxY-minY));ox=w/2-(minX+maxX)/2*scale;oy=h/2+(minY+maxY)/2*scale;draw();}
function screen(p){return [ox+p[0]*scale,oy-p[1]*scale]}function world(x,y){return [(x-ox)/scale,(oy-y)/scale]}function resize(){const d=devicePixelRatio||1;c.width=c.clientWidth*d;c.height=c.clientHeight*d;ctx.setTransform(d,0,0,d,0,0);draw()}new ResizeObserver(resize).observe(c);
function draw(){const w=c.clientWidth,h=c.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#101b2b';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#26364a';ctx.lineWidth=1;const step=Math.pow(10,Math.ceil(Math.log10(45/Math.max(scale,.00001))));const a=world(0,h),b=world(w,0);if((b[0]-a[0])/step<100)for(let x=Math.ceil(a[0]/step)*step;x<=b[0];x+=step){let t=screen([x,0])[0];ctx.beginPath();ctx.moveTo(t,0);ctx.lineTo(t,h);ctx.stroke();}if((b[1]-a[1])/step<100)for(let y=Math.ceil(a[1]/step)*step;y<=b[1];y+=step){let t=screen([0,y])[1];ctx.beginPath();ctx.moveTo(0,t);ctx.lineTo(w,t);ctx.stroke();}for(const s of [...shapes,...added]){ctx.strokeStyle=added.includes(s)?'#eac47f':'#77d7e9';ctx.lineWidth=1.4;ctx.beginPath();if(s.p?.length){let p=screen(s.p[0]);ctx.moveTo(...p);for(const q of s.p.slice(1))ctx.lineTo(...screen(q));if(s.closed)ctx.closePath();}else if(s.type==='CIRCLE'||s.type==='ARC'){const p=screen([s.x,s.y]);let a=s.type==='ARC'?s.start*Math.PI/180:0,b=s.type==='ARC'?s.end*Math.PI/180:Math.PI*2;ctx.arc(p[0],p[1],s.r*scale,-b,-a);}else if(s.type==='POINT'){let p=screen([s.x,s.y]);ctx.arc(...p,3,0,Math.PI*2);}ctx.stroke();}if(measureStart){const p=screen(measureStart);ctx.fillStyle='#f3c578';ctx.beginPath();ctx.arc(...p,5,0,Math.PI*2);ctx.fill();}}
function setmode(m){mode=m;for(const id of ['pan','measure'])document.getElementById(id).classList.toggle('active',id===m);hint.textContent=m==='measure'?'Chạm hai điểm để đo (chưa có bắt điểm chính xác).':m==='insert'?'Chạm vào bản vẽ để đặt block nội thất.':'Kéo để di chuyển, dùng hai ngón để thu phóng.';}
document.getElementById('pan').onclick=()=>setmode('pan');document.getElementById('measure').onclick=()=>{measureStart=null;setmode('measure')};document.getElementById('furniture').onchange=e=>{if(e.target.value)setmode('insert')};document.getElementById('fit').onclick=fit;document.getElementById('undo').onclick=()=>{added.pop();draw();say('Đã hoàn tác block cuối cùng')};
function point(e){const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);touches.set(e.pointerId,point(e));if(touches.size===1)down=point(e);if(touches.size===2){let a=[...touches.values()];pinch=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);}});c.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;const p=point(e),old=touches.get(e.pointerId);touches.set(e.pointerId,p);if(touches.size===2){let a=[...touches.values()],dist=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pinch){const center=[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2],q=world(...center),factor=dist/pinch;scale=Math.max(.00001,Math.min(10000,scale*factor));ox=center[0]-q[0]*scale;oy=center[1]+q[1]*scale;}pinch=dist;draw();}else if(mode==='pan'){ox+=p[0]-old[0];oy+=p[1]-old[1];draw();}});c.addEventListener('pointerup',e=>{const p=point(e);touches.delete(e.pointerId);if(touches.size<2)pinch=null;if(!down||Math.hypot(p[0]-down[0],p[1]-down[1])>10||touches.size)return;const q=world(...p);if(mode==='measure'){if(!measureStart){measureStart=q;say('Đã chọn điểm thứ nhất');}else{const d=Math.hypot(q[0]-measureStart[0],q[1]-measureStart[1]);say('Khoảng cách: '+d.toFixed(2)+' '+unit+' · Đo theo điểm chạm, chưa snap');measureStart=null;}}else if(mode==='insert'){const kind=document.getElementById('furniture').value,sz=sizes[kind];if(sz){added.push({type:'POLY',p:[[q[0],q[1]],[q[0]+sz[0],q[1]],[q[0]+sz[0],q[1]+sz[1]],[q[0],q[1]+sz[1]]],closed:true,layer:'HG_FURNITURE'});say('Đã chèn '+kind+' · '+sz.join('×')+' đơn vị CAD');}}draw();});c.addEventListener('pointercancel',e=>touches.delete(e.pointerId));c.addEventListener('wheel',e=>{e.preventDefault();const p=point(e),q=world(...p);scale*=e.deltaY<0?1.1:.9;ox=p[0]-q[0]*scale;oy=p[1]+q[1]*scale;draw();},{passive:false});
document.getElementById('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;if(/\.dwg$/i.test(f.name)){say('DWG chưa được hỗ trợ trực tiếp. Không đổi đuôi file.');hint.textContent='DWG cần bộ giải mã riêng. Hiện tại hãy dùng DXF để thử các chức năng.';return;}if(!/\.dxf$/i.test(f.name)){say('Chỉ hỗ trợ DXF trong bản thử nghiệm');return;}try{const text=await f.text();if(!/\bSECTION\b/.test(text)||!/\bENTITIES\b/.test(text))throw Error('Không nhận dạng được DXF ASCII');const result=parse(text);shapes=result.out;added=[];raw=text;fileName=f.name;unit=({1:'inch',4:'mm',5:'cm',6:'m'})[result.insunits]||'đơn vị';fit();say('Đã mở '+f.name+' · '+shapes.length+' đối tượng hỗ trợ · '+unit);hint.textContent='BETA: chỉ hiển thị LINE, LWPOLYLINE, CIRCLE, ARC, POINT; các đối tượng khác có thể bị thiếu.';}catch(err){say('Không mở được DXF: '+err.message);}};
function records(s){const out=[];const line=(a,b)=>['0','LINE','8','HG_FURNITURE','10',a[0],'20',a[1],'30',0,'11',b[0],'21',b[1],'31',0].join('\n');for(const s of added){for(let i=0;i<s.p.length;i++)out.push(line(s.p[i],s.p[(i+1)%s.p.length]));}return out.join('\n')+(out.length?'\n':'');}
document.getElementById('save').onclick=()=>{if(!raw){say('Hãy mở DXF trước khi lưu');return;}const re=/0\s*\nENDSEC/gi;let m,at=-1;while((m=re.exec(raw))!==null)at=m.index;if(at<0){say('Không tìm thấy điểm kết thúc ENTITIES; không thể xuất an toàn');return;}const head=raw.slice(0,at),tail=raw.slice(at);if(!/0\s*\nSECTION\s*\n2\s*\nENTITIES/i.test(head)){say('Không xác định được ENTITIES; không thể xuất');return;}const output=head+records()+tail;const blob=new Blob([output],{type:'application/dxf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fileName.replace(/\.dxf$/i,'')+'_HG_EDIT.dxf';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);say('Đã tạo DXF mới. Cần kiểm tra lại bằng phần mềm CAD trước khi sử dụng thi công.');};
fit();
</script></body></html>
